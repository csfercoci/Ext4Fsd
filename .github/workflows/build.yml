name: Build Ext4Fsd Driver

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'Ext4Fsd/**'
      - 'Ext2Mgr/**'
      - 'Ext2Srv/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  build-driver:
    name: Build Ext4Fsd Driver
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release, Debug]
        platform: [x64, Win32, ARM, ARM64]
      fail-fast: false
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check Windows Environment
      run: |
        Write-Host "=== Windows Environment Check ==="
        Write-Host "OS Version: $(Get-WmiObject win32_operatingsystem | select -expand caption)"
        Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
        Write-Host "Available RAM: $((Get-WmiObject -Class Win32_OperatingSystem).TotalVisibleMemorySize / 1GB) GB"
        if (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10") {
          Write-Host "Windows SDK: Found"
        } else {
          Write-Host "Windows SDK: NOT FOUND - May need installation"
        }

    - name: Install Windows Driver Kit (WDK) via Chocolatey
      shell: powershell
      run: |
        Write-Host "=== Installing WDK via Chocolatey ==="
        choco install -y windows-sdk-10-version-2104-all --no-progress
        choco install -y windowsdriverkit10 --no-progress

        Write-Host "=== Locating WDK paths ==="
        $wdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
        $includeRoot = Join-Path $wdkRoot "Include"

        if (-not (Test-Path $includeRoot)) {
          Write-Error "WDK include directory not found at $includeRoot"
          exit 1
        }

        $latestVersion = Get-ChildItem $includeRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1

        if (-not $latestVersion) {
          Write-Error "No SDK version found in $includeRoot"
          exit 1
        }

        $kmPath = Join-Path $latestVersion.FullName "km"
        $umPath = Join-Path $latestVersion.FullName "um"
        $sharedPath = Join-Path $latestVersion.FullName "shared"

        Write-Host "Selected SDK version: $($latestVersion.Name)"
        Write-Host "  KM path: $kmPath (exists: $(Test-Path $kmPath))"
        Write-Host "  UM path: $umPath (exists: $(Test-Path $umPath))"
        Write-Host "  Shared path: $sharedPath (exists: $(Test-Path $sharedPath))"

        if (-not (Test-Path $kmPath)) {
          Write-Error "Kernel-mode headers not found at $kmPath"
          exit 1
        }

        "WindowsSdkDir=$wdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "WindowsSDKVersion=$($latestVersion.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "KM_IncludePath=$kmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "UM_IncludePath=$umPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "Shared_IncludePath=$sharedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        Write-Host "✓ WDK configuration complete"

    - name: Ensure Windows Driver Kit (WDK)
      run: |
        Write-Host "=== Ensuring Windows Driver Kit (WDK) is installed ==="
        $wdkIncludeRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include'
        if (-not (Test-Path $wdkIncludeRoot)) {
          Write-Host "WDK include path missing. Installing via Chocolatey..."
          choco install windowsdriverkit10 -y --no-progress
        }
        if (-not (Test-Path $wdkIncludeRoot)) {
          Write-Error "WDK installation failed or path not found at $wdkIncludeRoot"
          exit 1
        }
        $latestInclude = Get-ChildItem $wdkIncludeRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
        if (-not $latestInclude) {
          Write-Error "Unable to locate versioned include directory under $wdkIncludeRoot"
          exit 1
        }
        $umPath = Join-Path $latestInclude.FullName 'um'
        $kmPath = Join-Path $latestInclude.FullName 'km'
        if (-not (Test-Path $umPath)) { Write-Error "UM include path missing at $umPath"; exit 1 }
        if (-not (Test-Path $kmPath)) { Write-Error "KM include path missing at $kmPath"; exit 1 }
        "UM_IncludePath=$umPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "KM_IncludePath=$kmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "✓ WDK ready at version $($latestInclude.Name)"
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ fromJSON('{"Win32":"x86","x64":"x64","ARM":"arm","ARM64":"arm64"}')[matrix.platform] }}
    
    - name: Add NuGet
      uses: nuget/setup-nuget@v2
    
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore NuGet Packages
      run: |
        nuget restore Ext4Fsd.sln
        if ($LASTEXITCODE -ne 0) {
          Write-Error "NuGet restore failed with exit code $LASTEXITCODE"
          exit 1
        }
    
    - name: Check Platform Support
      run: |
        Write-Host "=== Build Configuration ==="
        Write-Host "Building for platform: ${{ matrix.platform }}"
        Write-Host "Configuration: ${{ matrix.configuration }}"
        
        # Verify platform is available in project file
        if (Select-String -Path Ext4Fsd\Ext4Fsd.vcxproj -Pattern "${{ matrix.platform }}" -Quiet) {
          Write-Host "✓ Platform ${{ matrix.platform }} found in project"
        } else {
          Write-Error "✗ Platform ${{ matrix.platform }} NOT found in project - build may fail"
        }
    
    - name: Retarget Windows SDK Version
      run: |
        Get-ChildItem -Path . -Recurse -Filter *.vcxproj | ForEach-Object {
          (Get-Content $_.FullName) -replace '<WindowsTargetPlatformVersion>10.0.22621.0</WindowsTargetPlatformVersion>', '<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>' | Set-Content $_.FullName
        }
        Write-Host "✓ Retargeted Windows SDK version in all .vcxproj files"
    
    - name: Build Solution
      shell: pwsh
      run: |
        Write-Host "=== Starting MSBuild ==="
        $msbuildArgs = @(
          "Ext4Fsd.sln",
          "/p:Configuration=${{ matrix.configuration }}",
          "/p:Platform=${{ matrix.platform }}",
          "/p:WindowsTargetPlatformVersion=10.0",
          "/p:MaxCpuCount=4",
          "/verbosity:detailed",
          "/fl",
          "/flp:LogFile=msbuild-${{ matrix.platform }}-${{ matrix.configuration }}.log;Verbosity=detailed"
        )

        msbuild @msbuildArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Error "MSBuild failed for platform ${{ matrix.platform }} configuration ${{ matrix.configuration }}"
          exit 1
        }
        Write-Host "✓ Build completed successfully for ${{ matrix.platform }} - ${{ matrix.configuration }}"
    
    - name: Check Build Artifacts
      run: |
        Write-Host "=== Searching for Build Artifacts ==="
        $sysFiles = Get-ChildItem -Path . -Recurse -Filter "*.sys" -ErrorAction SilentlyContinue
        $dllFiles = Get-ChildItem -Path . -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue
        $pdbFiles = Get-ChildItem -Path . -Recurse -Filter "*.pdb" -ErrorAction SilentlyContinue
        
        Write-Host "Found $($sysFiles.Count) .sys files"
        Write-Host "Found $($dllFiles.Count) .dll files"
        Write-Host "Found $($pdbFiles.Count) .pdb files"
        
        if ($sysFiles.Count -eq 0) {
          Write-Warning "No .sys files found! Driver build may have failed."
        } else {
          $sysFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
        }
    
    - name: Upload Driver Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Ext4Fsd-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          **/*.sys
          **/*.dll
          **/*.pdb
        retention-days: 30
        compression-level: 9
    
    - name: Upload MSBuild Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: msbuild-logs-${{ matrix.configuration }}-${{ matrix.platform }}
        path: msbuild-*.log
        retention-days: 7
    
    - name: Create Platform Summary
      if: always()
      run: |
        $platform = "${{ matrix.platform }}"
        $config = "${{ matrix.configuration }}"
        $result = "${{ job.status }}"
        $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
        
        $summary = @"
Build Summary
=============
Platform: $platform
Configuration: $config
Status: $result
Timestamp: $timestamp
Commit: ${{ github.sha }}
Branch: ${{ github.ref }}
        "@
        
        $summary | Out-File -FilePath "build-$platform-$config.txt"
      
    - name: Upload Build Summary
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-summary-${{ matrix.platform }}-${{ matrix.configuration }}
        path: build-*.txt
        retention-days: 7

  build-manager:
    name: Build Ext2Mgr Application
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release, Debug]
        platform: [x64, Win32, ARM, ARM64]
      fail-fast: false
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Ensure Windows Driver Kit (WDK)
      run: |
        Write-Host "=== Ensuring Windows Driver Kit (WDK) is installed ==="
        $wdkIncludeRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include'
        if (-not (Test-Path $wdkIncludeRoot)) {
          Write-Host "WDK include path missing. Installing via Chocolatey..."
          choco install windowsdriverkit10 -y --no-progress
        }
        if (-not (Test-Path $wdkIncludeRoot)) {
          Write-Error "WDK installation failed or path not found at $wdkIncludeRoot"
          exit 1
        }
        $latestInclude = Get-ChildItem $wdkIncludeRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
        if (-not $latestInclude) {
          Write-Error "Unable to locate versioned include directory under $wdkIncludeRoot"
          exit 1
        }
        $umPath = Join-Path $latestInclude.FullName 'um'
        $kmPath = Join-Path $latestInclude.FullName 'km'
        if (-not (Test-Path $umPath)) { Write-Error "UM include path missing at $umPath"; exit 1 }
        if (-not (Test-Path $kmPath)) { Write-Error "KM include path missing at $kmPath"; exit 1 }
        "UM_IncludePath=$umPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "KM_IncludePath=$kmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "✓ WDK ready at version $($latestInclude.Name)"
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ fromJSON('{"Win32":"x86","x64":"x64","ARM":"arm","ARM64":"arm64"}')[matrix.platform] }}
    
    - name: Build Ext2Mgr
      run: |
        Write-Host "Building Ext2Mgr for ${{ matrix.platform }} - ${{ matrix.configuration }}"
        msbuild Ext2Mgr/Ext2Mgr.vcxproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:WindowsTargetPlatformVersion=10.0 `
          /p:MaxCpuCount=4 `
          /verbosity:detailed `
          /fl `
          /flp:LogFile=msbuild-mgr-${{ matrix.platform }}-${{ matrix.configuration }}.log;Verbosity=detailed
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Ext2Mgr build failed"
          exit 1
        }
    
    - name: Upload Ext2Mgr Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Ext2Mgr-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          **/*.exe
          **/*.pdb
        retention-days: 30
        compression-level: 9
    
    - name: Upload Ext2Mgr Build Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: msbuild-mgr-logs-${{ matrix.configuration }}-${{ matrix.platform }}
        path: msbuild-mgr-*.log
        retention-days: 7

  build-service:
    name: Build Ext2Srv Service
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release, Debug]
        platform: [x64, Win32, ARM, ARM64]
      fail-fast: false
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Ensure Windows Driver Kit (WDK)
      run: |
        Write-Host "=== Ensuring Windows Driver Kit (WDK) is installed ==="
        $wdkIncludeRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include'
        if (-not (Test-Path $wdkIncludeRoot)) {
          Write-Host "WDK include path missing. Installing via Chocolatey..."
          choco install windowsdriverkit10 -y --no-progress
        }
        if (-not (Test-Path $wdkIncludeRoot)) {
          Write-Error "WDK installation failed or path not found at $wdkIncludeRoot"
          exit 1
        }
        $latestInclude = Get-ChildItem $wdkIncludeRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
        if (-not $latestInclude) {
          Write-Error "Unable to locate versioned include directory under $wdkIncludeRoot"
          exit 1
        }
        $umPath = Join-Path $latestInclude.FullName 'um'
        $kmPath = Join-Path $latestInclude.FullName 'km'
        if (-not (Test-Path $umPath)) { Write-Error "UM include path missing at $umPath"; exit 1 }
        if (-not (Test-Path $kmPath)) { Write-Error "KM include path missing at $kmPath"; exit 1 }
        "UM_IncludePath=$umPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "KM_IncludePath=$kmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "✓ WDK ready at version $($latestInclude.Name)"
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ fromJSON('{"Win32":"x86","x64":"x64","ARM":"arm","ARM64":"arm64"}')[matrix.platform] }}
    
    - name: Build Ext2Srv
      run: |
        Write-Host "Building Ext2Srv for ${{ matrix.platform }} - ${{ matrix.configuration }}"
        msbuild Ext2Srv/Ext2Srv.vcxproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:WindowsTargetPlatformVersion=10.0 `
          /p:MaxCpuCount=4 `
          /verbosity:detailed `
          /fl `
          /flp:LogFile=msbuild-srv-${{ matrix.platform }}-${{ matrix.configuration }}.log;Verbosity=detailed
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Ext2Srv build failed"
          exit 1
        }
    
    - name: Upload Ext2Srv Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Ext2Srv-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          **/*.exe
          **/*.dll
          **/*.pdb
        retention-days: 30
        compression-level: 9
    
    - name: Upload Ext2Srv Build Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: msbuild-srv-logs-${{ matrix.configuration }}-${{ matrix.platform }}
        path: msbuild-srv-*.log
        retention-days: 7

  test-compilation:
    name: Test CRC Compilation
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup Visual Studio Build Tools
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Compile CRC Test
      run: |
        Write-Host "=== Compiling CRC Test Program ==="
        cd ${{ github.workspace }}
        cl test_ext4_csum.c /Fe:test_ext4_csum.exe /W3
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CRC test compilation failed"
          exit 1
        }
        Write-Host "✓ CRC test compiled successfully"
    
    - name: Run CRC Test
      run: |
        Write-Host "=== Running CRC Test ==="
        .\test_ext4_csum.exe
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "CRC test failed with exit code $LASTEXITCODE"
        } else {
          Write-Host "✓ CRC test passed"
        }
    
    - name: Upload Test Binary
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: test_ext4_csum
        path: test_ext4_csum.exe
        retention-days: 7

  build-status-summary:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [build-driver, build-manager, build-service]
    if: always()
    
    steps:
    - name: Download Build Summaries
      uses: actions/download-artifact@v4
      with:
        path: build-summaries
      continue-on-error: true
    
    - name: Generate Report
      run: |
        echo "# Build Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Driver Build Matrix" >> $GITHUB_STEP_SUMMARY
        echo "| Configuration | x86 | x64 | ARM | ARM64 |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Release | ✓ | ✓ | ✓ | ✓ |" >> $GITHUB_STEP_SUMMARY
        echo "| Debug | ✓ | ✓ | ✓ | ✓ |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
        echo "- Driver (.sys files)" >> $GITHUB_STEP_SUMMARY
        echo "- Manager Application (.exe files)" >> $GITHUB_STEP_SUMMARY
        echo "- Service (.exe files)" >> $GITHUB_STEP_SUMMARY
        echo "- Debug Symbols (.pdb files)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Supported Platforms" >> $GITHUB_STEP_SUMMARY
        echo "- **x86** (Win32) - 32-bit Windows" >> $GITHUB_STEP_SUMMARY
        echo "- **x64** - 64-bit Windows" >> $GITHUB_STEP_SUMMARY
        echo "- **ARM** - ARM 32-bit (Windows RT, Surface 2/3)" >> $GITHUB_STEP_SUMMARY
        echo "- **ARM64** - ARM 64-bit (Windows on ARM)" >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create Release Package
    runs-on: windows-latest
    needs: [build-driver, build-manager, build-service, build-status-summary]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
    
    - name: Create Release Directory Structure
      run: |
        mkdir release-package
        mkdir release-package\x86
        mkdir release-package\x64
        mkdir release-package\ARM
        mkdir release-package\ARM64
        mkdir release-package\docs
        
        # Copy documentation
        if (Test-Path "CHANGELOG.md") { copy CHANGELOG.md release-package\docs\ } else { Write-Host "CHANGELOG.md not found" }
        if (Test-Path "README.md") { copy README.md release-package\docs\ } else { Write-Host "README.md not found" }
        if (Test-Path "IMPROVEMENTS.md") { copy IMPROVEMENTS.md release-package\docs\ } else { Write-Host "IMPROVEMENTS.md not found" }
        if (Test-Path "DEVELOPMENT.md") { copy DEVELOPMENT.md release-package\docs\ } else { Write-Host "DEVELOPMENT.md not found" }
    
    - name: Organize Platform-Specific Artifacts
      run: |
        Write-Host "=== Organizing Artifacts by Platform ==="
        $artifacts = Get-ChildItem "release-artifacts" -Directory
        
        foreach ($artifact in $artifacts) {
          $name = $artifact.Name
          Write-Host "Processing: $name"
          
          if ($name -like "*x64*Release*") {
            Copy-Item "$($artifact.FullName)\*" "release-package\x64\" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  -> Copied to x64"
          }
          elseif ($name -like "*Win32*Release*" -or $name -like "*x86*Release*") {
            Copy-Item "$($artifact.FullName)\*" "release-package\x86\" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  -> Copied to x86"
          }
          elseif ($name -like "*ARM64*Release*") {
            Copy-Item "$($artifact.FullName)\*" "release-package\ARM64\" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  -> Copied to ARM64"
          }
          elseif ($name -like "*ARM*Release*") {
            Copy-Item "$($artifact.FullName)\*" "release-package\ARM\" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  -> Copied to ARM"
          }
        }
        
        Write-Host "=== Verifying Release Package Contents ==="
        Get-ChildItem -Path release-package -Recurse | ForEach-Object { Write-Host $_.FullName }
    
    - name: Create README for Release
      run: |
        @"
# Ext4Fsd Release Package

This package contains pre-built binaries for multiple platforms.

## Contents

- **x86/** - 32-bit Windows (Windows Vista/7/8/10/11)
- **x64/** - 64-bit Windows (Windows Vista/7/8/10/11)
- **ARM/** - ARM 32-bit (Windows RT, Surface 2/3)
- **ARM64/** - ARM 64-bit (Windows 10/11 on ARM)
- **docs/** - Documentation and changelog

## Installation

1. Extract the appropriate folder for your platform
2. Run the installation program or use the signed driver files
3. See docs/README.md for detailed instructions

## System Requirements

- Windows Vista SP1 or later
- Administrator privileges for driver installation

## Release Information

- **Release Date:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
- **Build Version:** ${{ github.ref }}
- **Commit:** ${{ github.sha }}

        "@ | Out-File "release-package\RELEASE_README.txt"
    
    - name: Create ZIP Archives
      run: |
        Write-Host "=== Creating Release Archives ==="
        
        # Create comprehensive archive with all platforms
        Compress-Archive -Path release-package -DestinationPath Ext4Fsd-Release-Universal.zip -Force -CompressionLevel Optimal
        Write-Host "✓ Created Ext4Fsd-Release-Universal.zip"
        
        # Create individual platform archives
        if ((Get-ChildItem "release-package\x86" -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0) {
          Compress-Archive -Path "release-package\x86" -DestinationPath "Ext4Fsd-Release-x86.zip" -Force -CompressionLevel Optimal
          Write-Host "✓ Created Ext4Fsd-Release-x86.zip"
        }
        
        if ((Get-ChildItem "release-package\x64" -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0) {
          Compress-Archive -Path "release-package\x64" -DestinationPath "Ext4Fsd-Release-x64.zip" -Force -CompressionLevel Optimal
          Write-Host "✓ Created Ext4Fsd-Release-x64.zip"
        }
        
        if ((Get-ChildItem "release-package\ARM" -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0) {
          Compress-Archive -Path "release-package\ARM" -DestinationPath "Ext4Fsd-Release-ARM.zip" -Force -CompressionLevel Optimal
          Write-Host "✓ Created Ext4Fsd-Release-ARM.zip"
        }
        
        if ((Get-ChildItem "release-package\ARM64" -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0) {
          Compress-Archive -Path "release-package\ARM64" -DestinationPath "Ext4Fsd-Release-ARM64.zip" -Force -CompressionLevel Optimal
          Write-Host "✓ Created Ext4Fsd-Release-ARM64.zip"
        }
        
        Write-Host "Release archives created:"
        Get-ChildItem "*.zip" | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length / 1MB) MB)" }
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          Ext4Fsd-Release-Universal.zip
          Ext4Fsd-Release-x86.zip
          Ext4Fsd-Release-x64.zip
          Ext4Fsd-Release-ARM.zip
          Ext4Fsd-Release-ARM64.zip
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-analysis:
    name: Code Quality Check
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Run Code Analysis
      run: |
        Write-Host "=== Code Complexity Analysis ==="
        $cFiles = Get-ChildItem -Path Ext4Fsd -Filter "*.c" -Recurse
        $hFiles = Get-ChildItem -Path Ext4Fsd -Filter "*.h" -Recurse
        
        Write-Host "Source Files:"
        Write-Host "  C files: $($cFiles.Count)"
        Write-Host "  H files: $($hFiles.Count)"
        
        # Calculate lines of code
        $totalLines = 0
        $cFiles | ForEach-Object { $totalLines += (Get-Content $_.FullName | Measure-Object -Line).Lines }
        $hFiles | ForEach-Object { $totalLines += (Get-Content $_.FullName | Measure-Object -Line).Lines }
        
        Write-Host "  Total Lines: $totalLines"
    
    - name: Check Documentation
      run: |
        Write-Host "=== Checking Required Documentation ==="
        $requiredDocs = @("README.md", "CHANGELOG.md")
        
        foreach ($doc in $requiredDocs) {
          if (Test-Path $doc) {
            Write-Host "✓ $doc found"
          } else {
            Write-Error "✗ $doc NOT found"
            exit 1
          }
        }
        Write-Host "Documentation check passed"
    
    - name: Validate INF Files
      run: |
        Write-Host "=== Validating Driver INF Files ==="
        $infFiles = Get-ChildItem -Path Ext4Fsd -Filter "*.inf" -Recurse
        
        if ($infFiles.Count -eq 0) {
          Write-Error "No .inf files found in Ext4Fsd directory"
          exit 1
        }
        
        $infFiles | ForEach-Object {
          Write-Host "✓ Found: $($_.Name)"
          if (-not (Select-String -Path $_.FullName -Pattern "DriverVer" -Quiet)) {
            Write-Warning "  Warning: No DriverVer found in $($_.Name)"
          }
        }
        Write-Host "INF validation passed"

  publish-artifacts:
    name: Publish Build Artifacts
    runs-on: ubuntu-latest
    needs: [build-driver, build-manager, build-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Summary
      run: |
        {
          echo "# Build Summary"
          echo ""
          echo "**Build Date:** $(date)"
          echo "**Commit:** ${{ github.sha }}"
          echo "**Branch:** ${{ github.ref }}"
          echo ""
          echo "## Artifacts"
          ls -la | grep -E "^d" | awk '{print "- " $NF}' || echo "- (none)"
        } > build-summary.md
        
        cat build-summary.md
    
    - name: Upload Summary
      uses: actions/upload-artifact@v4
      with:
        name: build-summary-report
        path: build-summary.md
        retention-days: 30
