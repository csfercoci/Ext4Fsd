name: Build Ext4Fsd

on:
  push:
    branches: [master, fix-wdk-build-v2]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WDK
      shell: pwsh
      run: |
        # windows-latest runners already have WDK installed; find the VSIX
        # and register it with the runner's Visual Studio instance.
        $wdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
        $vsix = Join-Path $wdkRoot "Vsix\WDK.vsix"
        if (-not (Test-Path $vsix)) {
          # Try alternative locations
          $vsix = Get-ChildItem -Path $wdkRoot -Filter "WDK.vsix" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        }
        if ($vsix -and (Test-Path $vsix)) {
          Write-Host "Found WDK VSIX: $vsix"
          # Find VSIXInstaller.exe for the runner's VS version
          $installer = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio" -Filter "VSIXInstaller.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($installer) {
            Write-Host "Registering WDK VSIX with $installer"
            & $installer /quiet $vsix
            Write-Host "WDK VSIX registered."
          } else {
            Write-Host "VSIXInstaller.exe not found."
          }
        } else {
          Write-Host "WDK VSIX not found; WDK headers should still be available via registry."
        }

    - name: Build driver (Release|x64)
      run: msbuild Ext4Fsd.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /m

    - name: Install NSIS
      uses: joncloud/makensis-action@v4

    - name: Build installer
      run: makensis Setup\ext2fsd.nsi

    - name: Upload driver
      uses: actions/upload-artifact@v4
      with:
        name: Ext2Fsd.sys
        path: Ext4Fsd\Release\x64\Ext2Fsd.sys

    - name: Upload user tools
      uses: actions/upload-artifact@v4
      with:
        name: Ext2Tools
        path: |
          Ext2Srv\Release\x64\Ext2Srv.exe
          Ext2Mgr\Release\x64\Ext2Mgr.exe

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Ext2Fsd-setup
        path: Setup\Ext2Fsd-setup.exe
