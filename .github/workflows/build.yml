name: Build Ext4Fsd

on:
  push:
    branches: [master, fix-wdk-build-v2]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Register WDK VSIX
      shell: pwsh
      run: |
        $wdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
        $vsix = Join-Path $wdkRoot "Vsix\WDK.vsix"
        if (!(Test-Path $vsix)) {
          $vsix = Get-ChildItem -Path $wdkRoot -Filter "WDK.vsix" -File -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $vsix -or !(Test-Path $vsix)) {
          throw "WDK VSIX not found under $wdkRoot"
        }
        # VSWHERE_PATH is an optional override; otherwise use the standard install locations.
        $vswhere = $env:VSWHERE_PATH
        if (-not $vswhere -or !(Test-Path $vswhere)) {
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        }
        if (!(Test-Path $vswhere)) {
          $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
        }
        if (!(Test-Path $vswhere)) {
          throw "vswhere.exe not found."
        }
        $vsInstallPath = & $vswhere -products * -latest -property installationPath
        if (-not $vsInstallPath) {
          throw "Visual Studio installation path not found."
        }
        $vsixInstaller = Join-Path $vsInstallPath "Common7\IDE\VSIXInstaller.exe"
        if (!(Test-Path $vsixInstaller)) {
          throw "VSIXInstaller.exe not found at $vsixInstaller"
        }
        Write-Host "Registering WDK VSIX: $vsix"
        & $vsixInstaller /quiet $vsix
        if ($LASTEXITCODE -ne 0) {
          throw "VSIXInstaller.exe failed with exit code $LASTEXITCODE"
        }
        Write-Host "WDK VSIX registered."

    - name: Build driver (Release|x64)
      run: msbuild Ext4Fsd.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /m

    - name: Install NSIS
      uses: joncloud/makensis-action@v4

    - name: Build installer
      run: makensis Setup\ext2fsd.nsi

    - name: Upload driver
      uses: actions/upload-artifact@v4
      with:
        name: Ext2Fsd.sys
        path: Ext4Fsd\Release\x64\Ext2Fsd.sys

    - name: Upload user tools
      uses: actions/upload-artifact@v4
      with:
        name: Ext2Tools
        path: |
          Ext2Srv\Release\x64\Ext2Srv.exe
          Ext2Mgr\Release\x64\Ext2Mgr.exe

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Ext2Fsd-setup
        path: Setup\Ext2Fsd-setup.exe
