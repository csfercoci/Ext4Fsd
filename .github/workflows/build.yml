name: Build Ext4Fsd

on:
  push:
    branches: [master, fix-wdk-build-v2]
  pull_request:
    branches: [master]

jobs:
  build:
    # Both windows-latest and windows-2025 get redirected to
    # windows-2025-vs2026 from 2026-06-15, so pinning the old image is
    # not possible.  Target the new image explicitly -- validated
    # end-to-end on it (WDK install + VSIX registration into VS 2026).
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # GitHub runner images ship the Windows SDK but NO Windows Driver Kit,
    # so two pieces can be missing (both no-ops on a dev machine that has
    # the WDKs, like local builds):
    #  1. km headers (ntifs.h) for the 26100 SDK the project targets
    #     -> WDK 10.0.26100 (winget manifest 10.1.26100.6584).
    #  2. VS-version-specific MSBuild tasks: VS 2026 (v18) loads
    #     Microsoft.DriverKit.Build.Tasks.18.0.dll, which only ships with
    #     the Dev18/SxS content of WDK 10.0.28000 (10.1.28000.1839).
    # Installer URLs + silent switches come from the official winget
    # manifests (Microsoft.WindowsWDK.*).
    - name: Install WDK (if kernel headers or build tasks missing)
      shell: pwsh
      run: |
        $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"

        function Install-Wdk([string]$name, [string]$url) {
          Write-Host "Installing $name..."
          $exe = Join-Path $env:RUNNER_TEMP "wdksetup-$name.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          # /features + : all features, including the SxS content that
          # populates OTHER kit versions' build\ dirs with this kit's
          # VS-version task assemblies.
          $p = Start-Process -FilePath $exe -ArgumentList '/q','/norestart','/features','+' -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "$name setup failed with exit code $($p.ExitCode)"
          }
        }

        # 1) Kernel headers for the SDK version the project targets.
        $km = Get-ChildItem -Path "$kits\Include" -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'km\ntifs.h') }
        if ($km) {
          Write-Host "WDK kernel headers already present: $($km.Name -join ', ')"
        } else {
          Install-Wdk 'WDK-10.0.26100' 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe'
          $km = Get-ChildItem -Path "$kits\Include" -Directory -ErrorAction SilentlyContinue |
                Where-Object { Test-Path (Join-Path $_.FullName 'km\ntifs.h') }
          if (-not $km) { throw "WDK installed but no Include\*\km\ntifs.h found under $kits" }
          Write-Host "WDK kernel headers installed: $($km.Name -join ', ')"
        }

        # 2) Driver build tasks matching the MSBuild/VS major version, in
        #    the build\ dir of the kit version the PROJECT targets -- the
        #    WDK targets load build\10.0.26100.0\bin\
        #    Microsoft.DriverKit.Build.Tasks.<VS major>.0.dll specifically.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsVer = & $vswhere -products * -latest -property installationVersion
        $vsMajor = [int](($vsVer -split '\.')[0])
        $dll = "Microsoft.DriverKit.Build.Tasks.$vsMajor.0.dll"
        $targetBin = "$kits\build\10.0.26100.0\bin"

        if (-not (Test-Path "$targetBin\$dll") -and $vsMajor -ge 18) {
          Install-Wdk 'WDK-10.0.28000' 'https://download.microsoft.com/download/302bbcbf-52ae-4e23-ba35-dce560124051/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe'
        }

        if (-not (Test-Path "$targetBin\$dll")) {
          # The newer kit only populated its own build\<ver>\bin: copy its
          # DriverKit task assemblies across, which is what its SxS
          # content does on full installs.
          $src = Get-ChildItem "$kits\build\*\bin\$dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($src) {
            Write-Host "Copying DriverKit task assemblies from $($src.DirectoryName) to $targetBin"
            Copy-Item "$($src.DirectoryName)\Microsoft.DriverKit.Build.Tasks.*" $targetBin -Force
          }
        }

        if (-not (Test-Path "$targetBin\$dll")) {
          throw "$dll not found in $targetBin (and no other build\*\bin provides it)"
        }
        Write-Host "DriverKit build tasks for VS $vsMajor present in $targetBin."

    - name: Register WDK VSIX
      shell: pwsh
      run: |
        # VSWHERE_PATH is an optional override; otherwise use the standard install locations.
        $vswhere = $env:VSWHERE_PATH
        if (-not $vswhere -or !(Test-Path $vswhere)) {
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        }
        if (!(Test-Path $vswhere)) {
          $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
        }
        if (!(Test-Path $vswhere)) {
          throw "vswhere.exe not found."
        }
        $vsInstallPath = & $vswhere -products * -latest -property installationPath
        if (-not $vsInstallPath) {
          throw "Visual Studio installation path not found via $vswhere -products * -latest -property installationPath"
        }
        $vsixInstaller = Join-Path $vsInstallPath "Common7\IDE\VSIXInstaller.exe"
        if (!(Test-Path $vsixInstaller)) {
          throw "VSIXInstaller.exe not found at $vsixInstaller"
        }

        # Check specifically for x64 kernel toolset (ARM64 may exist alone).
        $x64toolset = Join-Path $vsInstallPath "MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"
        $x64toolset180 = Join-Path $vsInstallPath "MSBuild\Microsoft\VC\v180\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"
        if ((Test-Path $x64toolset) -or (Test-Path $x64toolset180)) {
          Write-Host "x64 WDK kernel toolset found."
          return
        }

        $vsixRoots = @(
          "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix",
          "${env:ProgramFiles}\Windows Kits\10\Vsix"
        ) | Where-Object { Test-Path $_ }

        $vsix = $null
        foreach ($root in $vsixRoots) {
          $vsix = Get-ChildItem -Path $root -Filter "WDK.vsix" -File -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($vsix) { break }
        }
        if (-not $vsix -or !(Test-Path $vsix)) {
          throw "WDK toolset missing and WDK.vsix not found under: $($vsixRoots -join ', ')"
        }

        Write-Host "Registering WDK VSIX: $vsix"
        & $vsixInstaller /quiet $vsix
        if ($LASTEXITCODE -ne 0) {
          throw "VSIXInstaller.exe failed with exit code $LASTEXITCODE"
        }
        Write-Host "WDK VSIX registered."

    - name: Build Ext4Fsd (Release|x64)
      run: cmd /c build.cmd Release x64

    # windows-2025 runners no longer preinstall NSIS, and
    # joncloud/makensis-action only locates makensis (it does not install
    # it).  Install via Chocolatey, skipping when already present (local
    # runners / future images that bundle it).
    - name: Install NSIS
      shell: pwsh
      run: |
        if (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") {
          Write-Host "NSIS already installed."
          return
        }
        choco install nsis -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed: $LASTEXITCODE" }

    # The .nsi defaults point at one specific local BuildTools redist
    # install; discover the actual VC/MFC redist of the VS on this
    # machine via vswhere and override them.  Run from Setup\ so the
    # script's relative ..\ paths resolve as the author documented.
    - name: Build installer
      shell: pwsh
      working-directory: Setup
      run: |
        $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
        if (!(Test-Path $makensis)) { $makensis = (Get-Command makensis).Source }

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -products * -latest -property installationPath
        $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
               Sort-Object FullName | Select-Object -Last 1
        $mfc = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.MFC" -Directory |
               Sort-Object FullName | Select-Object -Last 1
        if (-not $crt -or -not $mfc) {
          throw "VC/MFC x64 redist not found under $vs\VC\Redist\MSVC"
        }
        Write-Host "CRT redist: $($crt.FullName)"
        Write-Host "MFC redist: $($mfc.FullName)"

        & $makensis "/DMSVPATH_X64=$($crt.FullName)" "/DMFCPATH_X64=$($mfc.FullName)" ext2fsd.nsi
        if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }

    - name: Upload driver
      uses: actions/upload-artifact@v7
      with:
        name: Ext2Fsd.sys
        path: Ext4Fsd\Release\x64\Ext2Fsd.sys

    - name: Upload user tools
      uses: actions/upload-artifact@v7
      with:
        name: Ext2Tools
        path: |
          Ext2Srv\Release\x64\Ext2Srv.exe
          Ext2Mgr\Release\x64\Ext2Mgr.exe

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: Ext2Fsd-setup
        path: Setup\Ext2Fsd-setup.exe
