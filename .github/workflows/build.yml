name: Build Ext4Fsd

on:
  push:
    branches: [master, fix-wdk-build-v2]
  pull_request:
    branches: [master]

jobs:
  build:
    # Pinned: windows-latest redirects to windows-2025-vs2026 from
    # 2026-06-15, and the WDK VSIX registration into VS 2026 is
    # unverified.  Revisit the pin once that image stabilizes.
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # The windows-2025 runner image ships the Windows 11 SDK 26100 but NO
    # Windows Driver Kit (windows-2022 still had one), so km headers
    # (ntifs.h) are missing.  Install the WDK only when no Include\*\km
    # directory exists -- on a machine with the WDK (local dev), this is a
    # no-op.  Installer URL + silent switch come from the official winget
    # manifest (Microsoft.WindowsWDK.10.0.26100, 10.1.26100.6584).
    - name: Install WDK (if kernel headers missing)
      shell: pwsh
      run: |
        $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
        $km = Get-ChildItem -Path $kits -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'km\ntifs.h') }
        if ($km) {
          Write-Host "WDK kernel headers already present: $($km.Name -join ', ')"
          return
        }

        Write-Host "WDK kernel headers missing - installing WDK 10.0.26100..."
        $url = 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe'
        $exe = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
        Invoke-WebRequest -Uri $url -OutFile $exe
        $p = Start-Process -FilePath $exe -ArgumentList '/q','/norestart' -Wait -PassThru
        if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
          throw "wdksetup.exe failed with exit code $($p.ExitCode)"
        }

        $km = Get-ChildItem -Path $kits -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'km\ntifs.h') }
        if (-not $km) {
          throw "wdksetup.exe succeeded but no Include\*\km\ntifs.h found under $kits"
        }
        Write-Host "WDK kernel headers installed: $($km.Name -join ', ')"

    - name: Register WDK VSIX
      shell: pwsh
      run: |
        # VSWHERE_PATH is an optional override; otherwise use the standard install locations.
        $vswhere = $env:VSWHERE_PATH
        if (-not $vswhere -or !(Test-Path $vswhere)) {
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        }
        if (!(Test-Path $vswhere)) {
          $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
        }
        if (!(Test-Path $vswhere)) {
          throw "vswhere.exe not found."
        }
        $vsInstallPath = & $vswhere -products * -latest -property installationPath
        if (-not $vsInstallPath) {
          throw "Visual Studio installation path not found via $vswhere -products * -latest -property installationPath"
        }
        $vsixInstaller = Join-Path $vsInstallPath "Common7\IDE\VSIXInstaller.exe"
        if (!(Test-Path $vsixInstaller)) {
          throw "VSIXInstaller.exe not found at $vsixInstaller"
        }

        # Check specifically for x64 kernel toolset (ARM64 may exist alone).
        $x64toolset = Join-Path $vsInstallPath "MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"
        $x64toolset180 = Join-Path $vsInstallPath "MSBuild\Microsoft\VC\v180\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"
        if ((Test-Path $x64toolset) -or (Test-Path $x64toolset180)) {
          Write-Host "x64 WDK kernel toolset found."
          return
        }

        $vsixRoots = @(
          "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix",
          "${env:ProgramFiles}\Windows Kits\10\Vsix"
        ) | Where-Object { Test-Path $_ }

        $vsix = $null
        foreach ($root in $vsixRoots) {
          $vsix = Get-ChildItem -Path $root -Filter "WDK.vsix" -File -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($vsix) { break }
        }
        if (-not $vsix -or !(Test-Path $vsix)) {
          throw "WDK toolset missing and WDK.vsix not found under: $($vsixRoots -join ', ')"
        }

        Write-Host "Registering WDK VSIX: $vsix"
        & $vsixInstaller /quiet $vsix
        if ($LASTEXITCODE -ne 0) {
          throw "VSIXInstaller.exe failed with exit code $LASTEXITCODE"
        }
        Write-Host "WDK VSIX registered."

    - name: Build Ext4Fsd (Release|x64)
      run: cmd /c build.cmd Release x64

    # windows-2025 runners no longer preinstall NSIS, and
    # joncloud/makensis-action only locates makensis (it does not install
    # it).  Install via Chocolatey, skipping when already present (local
    # runners / future images that bundle it).
    - name: Install NSIS
      shell: pwsh
      run: |
        if (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") {
          Write-Host "NSIS already installed."
          return
        }
        choco install nsis -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed: $LASTEXITCODE" }

    # The .nsi defaults point at one specific local BuildTools redist
    # install; discover the actual VC/MFC redist of the VS on this
    # machine via vswhere and override them.  Run from Setup\ so the
    # script's relative ..\ paths resolve as the author documented.
    - name: Build installer
      shell: pwsh
      working-directory: Setup
      run: |
        $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
        if (!(Test-Path $makensis)) { $makensis = (Get-Command makensis).Source }

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -products * -latest -property installationPath
        $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
               Sort-Object FullName | Select-Object -Last 1
        $mfc = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.MFC" -Directory |
               Sort-Object FullName | Select-Object -Last 1
        if (-not $crt -or -not $mfc) {
          throw "VC/MFC x64 redist not found under $vs\VC\Redist\MSVC"
        }
        Write-Host "CRT redist: $($crt.FullName)"
        Write-Host "MFC redist: $($mfc.FullName)"

        & $makensis "/DMSVPATH_X64=$($crt.FullName)" "/DMFCPATH_X64=$($mfc.FullName)" ext2fsd.nsi
        if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }

    - name: Upload driver
      uses: actions/upload-artifact@v7
      with:
        name: Ext2Fsd.sys
        path: Ext4Fsd\Release\x64\Ext2Fsd.sys

    - name: Upload user tools
      uses: actions/upload-artifact@v7
      with:
        name: Ext2Tools
        path: |
          Ext2Srv\Release\x64\Ext2Srv.exe
          Ext2Mgr\Release\x64\Ext2Mgr.exe

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: Ext2Fsd-setup
        path: Setup\Ext2Fsd-setup.exe
