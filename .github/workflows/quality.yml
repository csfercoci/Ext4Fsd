name: Code Quality & Security

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Install Windows Driver Kit (WDK)
      shell: powershell
      run: |
        Write-Host "=== Downloading and Installing Windows Driver Kit (WDK) ==="
        
        # Download WDK installer from Microsoft
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2249371"
        $installerPath = "$env:TEMP\wdksetup.exe"
        
        Write-Host "Downloading WDK installer..."
        Invoke-WebRequest -Uri $wdkUrl -OutFile $installerPath -UseBasicParsing
        
        Write-Host "Installing WDK (this may take several minutes)..."
        Start-Process -FilePath $installerPath -ArgumentList "/quiet", "/norestart", "/features", "+" -Wait -NoNewWindow
        
        Write-Host "WDK installation completed"
    
    - name: Verify and Configure WDK Paths
      shell: powershell
      run: |
        Write-Host "=== Verifying WDK Installation ==="
        
        $wdkRoot = $null
        $possibleRoots = @("$env:ProgramFiles\Windows Kits\10", "${env:ProgramFiles(x86)}\Windows Kits\10")
        
        foreach ($root in $possibleRoots) {
          if (Test-Path "$root\Include") {
            $wdkRoot = $root
            Write-Host "Found Windows Kit at: $root"
            break
          }
        }
        
        if (-not $wdkRoot) {
          Write-Error "Windows Kit installation not found"
          exit 1
        }
        
        Write-Host "Available SDK versions:"
        $includeRoot = Join-Path $wdkRoot "Include"
        $versions = Get-ChildItem $includeRoot -Directory | Sort-Object Name -Descending
        
        foreach ($ver in $versions) {
          Write-Host "  - $($ver.Name)"
          $kmPath = Join-Path $ver.FullName "km"
          $umPath = Join-Path $ver.FullName "um"
          Write-Host "    km: $(Test-Path $kmPath), um: $(Test-Path $umPath)"
        }
        
        $selectedVersion = $null
        foreach ($ver in $versions) {
          $testKm = Join-Path $ver.FullName "km"
          $testUm = Join-Path $ver.FullName "um"
          $testShared = Join-Path $ver.FullName "shared"
          
          if ((Test-Path $testKm) -and (Test-Path $testUm) -and (Test-Path $testShared)) {
            $selectedVersion = $ver
            Write-Host "Selected SDK version: $($ver.Name)"
            
            $umPath = $testUm
            $kmPath = $testKm
            
            "WindowsSdkDir=$wdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WindowsSDKVersion=$($ver.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "UM_IncludePath=$umPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "KM_IncludePath=$kmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            
            $libRoot = Join-Path $wdkRoot "Lib\$($ver.Name)"
            if (Test-Path $libRoot) {
              "WindowsSdkLibPath=$libRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
            
            break
          }
        }
        
        if (-not $selectedVersion) {
          Write-Host "No complete SDK version found, trying Chocolatey fallback..."
          
          choco install -y windows-sdk-10.0 --version=10.0.22621.0
          choco install -y windowsdriverkit10
          
          Start-Sleep -Seconds 5
          $versions = Get-ChildItem $includeRoot -Directory | Sort-Object Name -Descending
          
          foreach ($ver in $versions) {
            $testKm = Join-Path $ver.FullName "km"
            if (Test-Path $testKm) {
              $selectedVersion = $ver
              "WindowsSDKVersion=$($ver.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "KM_IncludePath=$testKm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Found version with km headers: $($ver.Name)"
              break
            }
          }
          
          if (-not $selectedVersion) {
            Write-Error "Failed to install WDK with kernel-mode headers"
            exit 1
          }
        }
        
        Write-Host "WDK Configuration Complete"

    - name: Locate Windows SDK Include Paths
      shell: powershell
      run: |
        Write-Host "=== Locating Windows SDK include paths ==="
        $wdkRoot = $env:WindowsSdkDir
        if (-not $wdkRoot) {
          $wdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
        }

        $includeRoot = Join-Path $wdkRoot "Include"
        if (-not (Test-Path $includeRoot)) {
          Write-Error "Windows SDK include directory not found at $includeRoot"
          exit 1
        }

        $candidateVersions = Get-ChildItem $includeRoot -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' }
        $latestVersion = $null
        foreach ($ver in ($candidateVersions | Sort-Object Name -Descending)) {
          $testUm = Join-Path $ver.FullName "um"
          $testShared = Join-Path $ver.FullName "shared"
          $testUcrt = Join-Path $ver.FullName "ucrt"
          if ((Test-Path $testUm) -and (Test-Path $testShared) -and (Test-Path $testUcrt)) {
            $latestVersion = $ver
            break
          }
        }

        if (-not $latestVersion) {
          Write-Error "No SDK version with um/shared/ucrt includes found in $includeRoot"
          exit 1
        }

        $kmPath = Join-Path $latestVersion.FullName "km"
        $umPath = Join-Path $latestVersion.FullName "um"
        $sharedPath = Join-Path $latestVersion.FullName "shared"
        $ucrtPath = Join-Path $latestVersion.FullName "ucrt"

        Write-Host "Selected SDK version: $($latestVersion.Name)"
        Write-Host "  KM path: $kmPath (exists: $(Test-Path $kmPath))"
        Write-Host "  UM path: $umPath (exists: $(Test-Path $umPath))"
        Write-Host "  Shared path: $sharedPath (exists: $(Test-Path $sharedPath))"
        Write-Host "  UCRT path: $ucrtPath (exists: $(Test-Path $ucrtPath))"

        if (-not (Test-Path $umPath)) { Write-Error "UM include path missing at $umPath"; exit 1 }
        if (-not (Test-Path $sharedPath)) { Write-Error "Shared include path missing at $sharedPath"; exit 1 }
        if (-not (Test-Path $ucrtPath)) { Write-Error "UCRT include path missing at $ucrtPath"; exit 1 }

        "KM_IncludePath=$kmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "UM_IncludePath=$umPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "Shared_IncludePath=$sharedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "UCRT_IncludePath=$ucrtPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1
      with:
        vs-version: '[17.0,)'
    
    - name: Setup Visual Studio Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Build with MSBuild
      shell: cmd
      env:
        WindowsSdkDir: ${{ env.WindowsSdkDir }}
        WindowsSDKVersion: ${{ env.WindowsSDKVersion }}
        KM_IncludePath: ${{ env.KM_IncludePath }}
        UM_IncludePath: ${{ env.UM_IncludePath }}
        Shared_IncludePath: ${{ env.Shared_IncludePath }}
        UCRT_IncludePath: ${{ env.UCRT_IncludePath }}
      run: |
        echo === Configuring include paths ===
        echo KM_IncludePath=%KM_IncludePath%
        echo UM_IncludePath=%UM_IncludePath%
        echo Shared_IncludePath=%Shared_IncludePath%
        echo UCRT_IncludePath=%UCRT_IncludePath%

        set "INCLUDE=%KM_IncludePath%;%UM_IncludePath%;%Shared_IncludePath%;%UCRT_IncludePath%;%INCLUDE%"

        echo === Building with MSBuild ===
        msbuild Ext4Fsd.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:AdditionalIncludeDirectories="%KM_IncludePath%;%UM_IncludePath%;%Shared_IncludePath%;%UCRT_IncludePath%;%(AdditionalIncludeDirectories)" /verbosity:minimal
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  format-check:
    name: Code Format Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Check Line Endings
      run: |
        echo "Checking for consistent line endings..."
        # Check for Windows CRLF in source files
        if grep -r -l $'\r' Ext4Fsd/*.c Ext4Fsd/*.h 2>/dev/null; then
          echo "✓ Windows line endings found (expected for Windows driver)"
        fi
    
    - name: Check for Trailing Whitespace
      run: |
        echo "Checking for trailing whitespace..."
        if grep -r "[[:space:]]$" Ext4Fsd --include="*.c" --include="*.h"; then
          echo "⚠ Found trailing whitespace"
        else
          echo "✓ No trailing whitespace found"
        fi
    
    - name: Validate Documentation
      run: |
        echo "Validating markdown files..."
        for file in README.md CHANGELOG.md IMPROVEMENTS.md DEVELOPMENT.md; do
          if [ -f "$file" ]; then
            echo "✓ $file found"
          else
            echo "✗ Missing $file"
          fi
        done

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Analyze Include Dependencies
      run: |
        echo "Analyzing include dependencies..."
        echo ""
        echo "## Header Dependencies"
        
        # Find all includes in C files
        grep -h "#include" Ext4Fsd/*.c | sort | uniq -c | sort -rn | head -20
        
        echo ""
        echo "## Windows API Usage"
        grep -r "ntdef\|ntddk\|winnt" Ext4Fsd --include="*.h" | wc -l
        echo "Windows API references found"

  metrics:
    name: Code Metrics
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Calculate Code Statistics
      run: |
        echo "# Code Metrics Report" > metrics.md
        echo "" >> metrics.md
        
        echo "## File Counts" >> metrics.md
        echo "- C Source Files: $(find Ext4Fsd -name "*.c" | wc -l)" >> metrics.md
        echo "- Header Files: $(find Ext4Fsd -name "*.h" | wc -l)" >> metrics.md
        echo "- Resource Files: $(find Ext4Fsd -name "*.rc" | wc -l)" >> metrics.md
        echo "" >> metrics.md
        
        echo "## Lines of Code" >> metrics.md
        echo "- Total LOC: $(find Ext4Fsd -name "*.c" -o -name "*.h" | xargs wc -l | tail -1 | awk '{print $1}')" >> metrics.md
        echo "- Comment Lines: $(grep -r "^\s*//" Ext4Fsd --include="*.c" --include="*.h" | wc -l)" >> metrics.md
        echo "" >> metrics.md
        
        echo "## Complexity Indicators" >> metrics.md
        echo "- Functions: $(grep -r "^[a-zA-Z_].*(.*)$" Ext4Fsd --include="*.c" | wc -l)" >> metrics.md
        echo "- Structs: $(grep -r "^typedef struct\|^struct " Ext4Fsd --include="*.h" | wc -l)" >> metrics.md
        echo "- Macros: $(grep -r "^#define" Ext4Fsd --include="*.h" | wc -l)" >> metrics.md
    
    - name: Upload Metrics
      uses: actions/upload-artifact@v4
      with:
        name: code-metrics
        path: metrics.md
        retention-days: 30

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [codeql, format-check, dependency-check, metrics]
    if: always()
    
    steps:
    - name: Check Results
      run: |
        echo "## Code Quality Check Summary"
        echo "- CodeQL Analysis: $([ '${{ needs.codeql.result }}' = 'success' ] && echo '✓' || echo '✗')"
        echo "- Format Check: $([ '${{ needs.format-check.result }}' = 'success' ] && echo '✓' || echo '✗')"
        echo "- Dependency Check: $([ '${{ needs.dependency-check.result }}' = 'success' ] && echo '✓' || echo '✗')"
        echo "- Metrics: $([ '${{ needs.metrics.result }}' = 'success' ] && echo '✓' || echo '✗')"
