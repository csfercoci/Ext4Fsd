name: Code Quality & Security

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Build with MSBuild
      run: |
        msbuild Ext4Fsd.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /verbosity:minimal
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  format-check:
    name: Code Format Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Check Line Endings
      run: |
        echo "Checking for consistent line endings..."
        # Check for Windows CRLF in source files
        if grep -r -l $'\r' Ext4Fsd/*.c Ext4Fsd/*.h 2>/dev/null; then
          echo "✓ Windows line endings found (expected for Windows driver)"
        fi
    
    - name: Check for Trailing Whitespace
      run: |
        echo "Checking for trailing whitespace..."
        if grep -r "[[:space:]]$" Ext4Fsd --include="*.c" --include="*.h"; then
          echo "⚠ Found trailing whitespace"
        else
          echo "✓ No trailing whitespace found"
        fi
    
    - name: Validate Documentation
      run: |
        echo "Validating markdown files..."
        for file in README.md CHANGELOG.md IMPROVEMENTS.md DEVELOPMENT.md; do
          if [ -f "$file" ]; then
            echo "✓ $file found"
          else
            echo "✗ Missing $file"
          fi
        done

  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Analyze Include Dependencies
      run: |
        echo "Analyzing include dependencies..."
        echo ""
        echo "## Header Dependencies"
        
        # Find all includes in C files
        grep -h "#include" Ext4Fsd/*.c | sort | uniq -c | sort -rn | head -20
        
        echo ""
        echo "## Windows API Usage"
        grep -r "ntdef\|ntddk\|winnt" Ext4Fsd --include="*.h" | wc -l
        echo "Windows API references found"

  metrics:
    name: Code Metrics
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Calculate Code Statistics
      run: |
        echo "# Code Metrics Report" > metrics.md
        echo "" >> metrics.md
        
        echo "## File Counts" >> metrics.md
        echo "- C Source Files: $(find Ext4Fsd -name "*.c" | wc -l)" >> metrics.md
        echo "- Header Files: $(find Ext4Fsd -name "*.h" | wc -l)" >> metrics.md
        echo "- Resource Files: $(find Ext4Fsd -name "*.rc" | wc -l)" >> metrics.md
        echo "" >> metrics.md
        
        echo "## Lines of Code" >> metrics.md
        echo "- Total LOC: $(find Ext4Fsd -name "*.c" -o -name "*.h" | xargs wc -l | tail -1 | awk '{print $1}')" >> metrics.md
        echo "- Comment Lines: $(grep -r "^\s*//" Ext4Fsd --include="*.c" --include="*.h" | wc -l)" >> metrics.md
        echo "" >> metrics.md
        
        echo "## Complexity Indicators" >> metrics.md
        echo "- Functions: $(grep -r "^[a-zA-Z_].*(.*)$" Ext4Fsd --include="*.c" | wc -l)" >> metrics.md
        echo "- Structs: $(grep -r "^typedef struct\|^struct " Ext4Fsd --include="*.h" | wc -l)" >> metrics.md
        echo "- Macros: $(grep -r "^#define" Ext4Fsd --include="*.h" | wc -l)" >> metrics.md
    
    - name: Upload Metrics
      uses: actions/upload-artifact@v4
      with:
        name: code-metrics
        path: metrics.md
        retention-days: 30

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [codeql, format-check, dependency-check, metrics]
    if: always()
    
    steps:
    - name: Check Results
      run: |
        echo "## Code Quality Check Summary"
        echo "- CodeQL Analysis: $([ '${{ needs.codeql.result }}' = 'success' ] && echo '✓' || echo '✗')"
        echo "- Format Check: $([ '${{ needs.format-check.result }}' = 'success' ] && echo '✓' || echo '✗')"
        echo "- Dependency Check: $([ '${{ needs.dependency-check.result }}' = 'success' ] && echo '✓' || echo '✗')"
        echo "- Metrics: $([ '${{ needs.metrics.result }}' = 'success' ] && echo '✓' || echo '✗')"
